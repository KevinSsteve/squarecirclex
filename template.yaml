    Value: !Ref TrendsTable
    Export:
      Name: !Sub '${AWS::StackName}-TrendsTable'

  OnboardingSessionsTableName:
    Description: Onboarding Sessions DynamoDB Table Name
    Value: !Ref OnboardingSessionsTable
    Export:
      Name: !Sub '${AWS::StackName}-OnboardingSessionsTable'

  OAuthConnectionsTableName:
    Description: OAuth Connections DynamoDB Table Name
    Value: !Ref OAuthConnectionsTable
    Export:
      Name: !Sub '${AWS::StackName}-OAuthConnectionsTable'

  PlatformCredentialsTableName:
    Description: Platform Credentials DynamoDB Table Name
    Value: !Ref PlatformCredentialsTable
    Export:
      Name: !Sub '${AWS::StackName}-PlatformCredentialsTable'

  # S3
  ContentBucketName:
    Description: S3 Bucket for Content Storage
    Value: !Ref ContentBucket
    Export:
      Name: !Sub '${AWS::StackName}-ContentBucket'

  # EventBridge
  EventBusName:
    Description: EventBridge Event Bus Name
    Value: !Ref ExpertaEventBus
    Export:
      Name: !Sub '${AWS::StackName}-EventBus'

  # KMS
  EncryptionKeyId:
    Description: KMS Key ID for Credential Encryption
    Value: !Ref CredentialEncryptionKey
    Export:
      Name: !Sub '${AWS::StackName}-EncryptionKey'

  # SNS
  FailureTopicArn:
    Description: SNS Topic ARN for Failure Notifications
    Value: !Ref FailureNotificationTopic
    Export:
      Name: !Sub '${AWS::StackName}-FailureTopic'

  # IAM
  LambdaExecutionRoleArn:
    Description: Lambda Execution Role ARN
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaRole'

  # Lambda Functions
  OnboardingFunctionArn:
    Description: Onboarding Lambda Function ARN
    Value: !GetAtt OnboardingFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OnboardingFunction'

  OnboardingFunctionName:
    Description: Onboarding Lambda Function Name
